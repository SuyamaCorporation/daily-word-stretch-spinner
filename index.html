<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のひとこと ランダム ワードスピナー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0c1426; color: #f0f4ff; font-family: 'Segoe UI', sans-serif; }
  @keyframes spinIn { from{opacity:0;transform:rotateX(90deg) scale(0.8)} to{opacity:1;transform:rotateX(0) scale(1)} }
  .spin-in { animation: spinIn 0.5s ease-out; }
  @keyframes heartBeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  .heart-beat { animation: heartBeat 0.3s ease; }
  input[type=range] { accent-color: #3b82f6; }
  ::-webkit-scrollbar { width:5px } ::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:3px }
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-blue-300 mb-1">📖 今日のひとこと ワードスピナー</h1>
  <p class="text-gray-400 text-sm mb-5">毎日1単語をランダム提示。語源・類義語・例文付き。お気に入り保存・30日チャレンジ。</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
    <!-- メインカード -->
    <div class="md:col-span-2">
      <!-- 今日の単語 -->
      <div id="word-card" class="bg-gradient-to-br from-blue-900 to-indigo-900 rounded-2xl p-6 mb-4 border border-blue-700 relative">
        <div class="absolute top-3 right-3 flex gap-2">
          <span id="word-type-badge" class="text-xs bg-blue-800 text-blue-200 px-2 py-1 rounded-full"></span>
          <button id="fav-btn" onclick="toggleFavorite()" class="text-2xl transition-transform" aria-label="お気に入りに追加">🤍</button>
        </div>
        <div id="word-display" class="text-5xl font-bold text-white mb-2 spin-in">──</div>
        <div id="reading-display" class="text-gray-300 text-lg mb-1"></div>
        <div id="meaning-display" class="text-gray-200 text-base mb-4 leading-relaxed"></div>

        <div class="space-y-3 text-sm">
          <div class="bg-black bg-opacity-30 rounded-lg p-3">
            <span class="text-blue-300 font-semibold">語源: </span>
            <span id="etymology-display" class="text-gray-300"></span>
          </div>
          <div class="bg-black bg-opacity-30 rounded-lg p-3">
            <span class="text-green-300 font-semibold">例文: </span>
            <span id="example-display" class="text-gray-200 italic"></span>
          </div>
          <div class="flex flex-wrap gap-3">
            <div class="bg-black bg-opacity-30 rounded-lg p-3 flex-1 min-w-0">
              <div class="text-yellow-300 font-semibold text-xs mb-1">類義語</div>
              <div id="syn-display" class="text-gray-300 text-xs"></div>
            </div>
            <div class="bg-black bg-opacity-30 rounded-lg p-3 flex-1 min-w-0">
              <div class="text-red-300 font-semibold text-xs mb-1">反義語</div>
              <div id="ant-display" class="text-gray-300 text-xs"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-3 mb-5">
        <button onclick="showTodayWord()" class="flex-1 bg-blue-700 hover:bg-blue-600 text-white font-bold py-2 rounded-xl transition-colors" aria-label="今日のひとことを表示">📅 今日のひとこと</button>
        <button onclick="showRandomWord()" class="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-2 rounded-xl transition-colors" aria-label="別の単語を引く">🎲 別の単語を引く</button>
      </div>

      <!-- お気に入りリスト -->
      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
        <h2 class="text-base font-semibold text-blue-200 mb-3">❤️ お気に入りリスト（<span id="fav-count">0</span>件）</h2>
        <div id="fav-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
        <div id="fav-empty" class="text-gray-500 text-sm">ハートボタンでお気に入りに追加できます</div>
      </div>
    </div>

    <!-- サイドバー: チャレンジ -->
    <div class="space-y-4">
      <!-- 30日チャレンジ -->
      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
        <h2 class="text-base font-semibold text-green-300 mb-3">🔥 30日チャレンジ</h2>
        <div class="text-center mb-4">
          <div id="streak-count" class="text-5xl font-bold text-orange-400">0</div>
          <div class="text-gray-400 text-sm">日連続</div>
          <div class="text-xs text-gray-500 mt-1" id="streak-max">最大 0 日</div>
        </div>

        <!-- カレンダー -->
        <div id="streak-calendar" class="grid grid-cols-7 gap-1 mb-3"></div>
        <div class="text-xs text-gray-500 text-center">今月の記録カレンダー</div>

        <button onclick="markToday()" class="mt-3 w-full bg-green-700 hover:bg-green-600 text-white py-2 rounded-lg text-sm font-semibold" aria-label="今日の確認を記録する">✅ 今日確認した！</button>
        <div id="streak-msg" class="text-xs text-gray-400 mt-2 text-center"></div>
      </div>

      <!-- カテゴリ別統計 -->
      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
        <h2 class="text-sm font-semibold text-gray-300 mb-3">カテゴリ別</h2>
        <div id="cat-stats" class="space-y-1 text-xs"></div>
      </div>
    </div>
  </div>
</div>

  {w:'余白',r:'よはく',cat:'漢語',mean:'書かれていない空間・ゆとり・伝わらない部分の美',ety:'余=余る+白=白いまま。余った白い空間',ex:'余白のある話し方が想像力を引き出す。',syn:'空白・余地・間（ま）',ant:'埋め尽くし・過密・説明過多'},
  {w:'うねり',r:'うねり',cat:'和語',mean:'波や地形・気運などが大きくゆっくりと起伏する様子',ety:'「うねる」の名詞形。曲がりくねって動くさま',ex:'時代のうねりに乗れる者が生き残る。',syn:'波動・動勢・潮流',ant:'静止・停滞・凪'},
  {w:'旺盛',r:'おうせい',cat:'漢語',mean:'勢いが盛んで活発なこと・意欲が満ちあふれていること',ety:'旺=盛んに輝く+盛=さかんである',ex:'旺盛な好奇心が彼の原動力だ。',syn:'活発・旺んな・エネルギッシュ',ant:'衰退・消極的・沈滞'},
  {w:'遡及',r:'そきゅう',cat:'漢語',mean:'過去に遡って効力を持たせること',ety:'遡=さかのぼる+及=及ぶ。過去に向かって力が届く',ex:'改正法の遡及適用は原則禁止だ。',syn:'さかのぼる・遡行・後及',ant:'将来効・前進・未来適用'},
];

let currentWordIdx = null;
let favorites = JSON.parse(localStorage.getItem('word-favorites') || '[]');
let checkedDays = JSON.parse(localStorage.getItem('word-streak-days') || '[]');
let streak = parseInt(localStorage.getItem('word-streak') || '0');
let maxStreak = parseInt(localStorage.getItem('word-max-streak') || '0');

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getTodayIndex() {
  const start = new Date('2024-01-01');
  const now = new Date();
  const diff = Math.floor((now - start) / 86400000);
  return diff % WORDS.length;
}

function showWord(idx) {
  currentWordIdx = idx;
  const w = WORDS[idx];

  const wEl = document.getElementById('word-display');
  wEl.className = 'text-5xl font-bold text-white mb-2';
  void wEl.offsetWidth;
  wEl.className = 'text-5xl font-bold text-white mb-2 spin-in';
  wEl.textContent = w.w;

  document.getElementById('reading-display').textContent = '読み: ' + w.r;
  document.getElementById('meaning-display').textContent = w.mean;
  document.getElementById('etymology-display').textContent = w.ety;
  document.getElementById('example-display').textContent = w.ex;
  document.getElementById('syn-display').textContent = w.syn;
  document.getElementById('ant-display').textContent = w.ant;
  document.getElementById('word-type-badge').textContent = w.cat;

  const isFav = favorites.includes(idx);
  document.getElementById('fav-btn').textContent = isFav ? '❤️' : '🤍';
}

function showTodayWord() {
  showWord(getTodayIndex());
}

function showRandomWord() {
  let idx;
  do { idx = Math.floor(Math.random() * WORDS.length); } while (idx === currentWordIdx);
  showWord(idx);
}

function toggleFavorite() {
  if (currentWordIdx === null) return;
  const idx = favorites.indexOf(currentWordIdx);
  const btn = document.getElementById('fav-btn');
  if (idx >= 0) {
    favorites.splice(idx, 1);
    btn.textContent = '🤍';
  } else {
    favorites.push(currentWordIdx);
    btn.textContent = '❤️';
    btn.classList.add('heart-beat');
    setTimeout(() => btn.classList.remove('heart-beat'), 400);
  }
  localStorage.setItem('word-favorites', JSON.stringify(favorites));
  renderFavorites();
}

function renderFavorites() {
  const list = document.getElementById('fav-list');
  const empty = document.getElementById('fav-empty');
  const count = document.getElementById('fav-count');
  list.innerHTML = '';
  count.textContent = favorites.length;

  if (favorites.length === 0) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  favorites.forEach(idx => {
    const w = WORDS[idx];
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 py-2 border-b border-gray-700 cursor-pointer hover:bg-gray-700 rounded px-2';
    row.setAttribute('role', 'button');
    row.setAttribute('aria-label', w.w + 'を表示');
    const word = document.createElement('span');
    word.className = 'font-bold text-blue-300';
    word.textContent = w.w;
    const reading = document.createElement('span');
    reading.className = 'text-xs text-gray-400';
    reading.textContent = w.r;
    const mean = document.createElement('span');
    mean.className = 'text-xs text-gray-300 flex-1 truncate';
    mean.textContent = w.mean;
    row.appendChild(word); row.appendChild(reading); row.appendChild(mean);
    row.onclick = () => showWord(idx);
    list.appendChild(row);
  });
}

function markToday() {
  const today = getTodayStr();
  const msg = document.getElementById('streak-msg');
  if (checkedDays.includes(today)) {
    msg.textContent = '今日はすでに確認済みです！';
    return;
  }
  // Check if yesterday was also checked
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yd = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2,'0') + '-' + String(yesterday.getDate()).padStart(2,'0');
  if (checkedDays.includes(yd)) {
    streak++;
  } else if (checkedDays.length === 0) {
    streak = 1;
  } else {
    streak = 1;
  }
  maxStreak = Math.max(maxStreak, streak);
  checkedDays.push(today);
  localStorage.setItem('word-streak-days', JSON.stringify(checkedDays));
  localStorage.setItem('word-streak', String(streak));
  localStorage.setItem('word-max-streak', String(maxStreak));
  msg.textContent = streak >= 30 ? '🎉 30日チャレンジ達成！' : '継続中！次のチェックも忘れずに 💪';
  renderStreak();
}

function renderStreak() {
  document.getElementById('streak-count').textContent = streak;
  document.getElementById('streak-max').textContent = '最大 ' + maxStreak + ' 日';

  // Calendar
  const cal = document.getElementById('streak-calendar');
  cal.innerHTML = '';
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const dayNames = ['日','月','火','水','木','金','土'];
  dayNames.forEach(d => {
    const el = document.createElement('div');
    el.className = 'text-center text-xs text-gray-500';
    el.textContent = d;
    cal.appendChild(el);
  });
  const firstDow = new Date(year, month, 1).getDay();
  for (let i = 0; i < firstDow; i++) {
    const el = document.createElement('div'); cal.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const el = document.createElement('div');
    el.className = 'text-center text-xs rounded ' + (checkedDays.includes(dateStr)
      ? 'bg-green-600 text-white font-bold'
      : (d === now.getDate() ? 'bg-gray-600 text-white' : 'text-gray-500'));
    el.textContent = d;
    cal.appendChild(el);
  }
}

function renderCatStats() {
  const stats = {};
  WORDS.forEach(w => { stats[w.cat] = (stats[w.cat] || 0) + 1; });
  const container = document.getElementById('cat-stats');
  container.innerHTML = '';
  Object.entries(stats).forEach(([cat, count]) => {
    const row = document.createElement('div');
    row.className = 'flex justify-between text-gray-400';
    const k = document.createElement('span'); k.textContent = cat;
    const v = document.createElement('span'); v.className = 'font-mono'; v.textContent = count + '語';
    row.appendChild(k); row.appendChild(v);
    container.appendChild(row);
  });
}

showTodayWord();
renderFavorites();
renderStreak();
renderCatStats();
</script>
</body>
</html>
